[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertriage"
version = "0.4.0"
license = { text = "MIT" }
authors = [
    { name = "Tomislav Sola" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=4.0",
    "scikit-learn>=1.4",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
embeddings = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7",
    "networkx>=3.2",
    "pyvis>=0.3",
]

[project.scripts]
papertriage = "papertriage.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
